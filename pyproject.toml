[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fcgrsd"
version = "1.0.0"
description = "FCGR-SD: alignment-free genome comparison on Grassmann manifolds (Python reproduction of Li et al., The Innovation 2024)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FCGR-SD Python reproduction" }]
keywords = ["bioinformatics", "alignment-free", "CGR", "FCGR", "Grassmann manifold", "phylogeny"]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
bench = ["scipy>=1.8", "biopython>=1.79"]
test = ["pytest>=7.0", "scipy>=1.8"]

[project.scripts]
fcgrsd = "fcgrsd.cli:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/FCGR-SD-Python"
Repository = "https://github.com/ZengZichao/FCGR-SD-Python"
Issues = "https://github.com/ZengZichao/FCGR-SD-Python/issues"

[tool.setuptools]
packages = ["fcgrsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
